version: "2"

run:
  # The dashboard is embedded only after `npm run build`; lint without it.
  build-tags:
    - nowebui

linters:
  default: standard
  enable:
    - bodyclose
    - errorlint
    - gocritic
    - gosec
    - misspell
    - nolintlint
    - revive
    - unconvert
    - unparam
  settings:
    gosec:
      excludes:
        # Specmetry runs git and user-confirmed checks as subprocesses by design.
        - G204
        # Paths are the data directory's own files or ones the user named.
        - G304
    revive:
      rules:
        - name: exported
          disabled: true
  exclusions:
    presets:
      - std-error-handling
    rules:
      - path: (_test\.go|internal/testutil/)
        linters:
          - gosec

formatters:
  enable:
    - gofmt
    - goimports
  settings:
    goimports:
      local-prefixes:
        - github.com/XKHoshizora/specmetry
