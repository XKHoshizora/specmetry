name: CI

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  go-test:
    name: Go tests (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-go@v7.0.0
        with:
          go-version-file: go.mod
      - name: Test
        shell: bash
        run: |
          race=""
          if [ "$RUNNER_OS" = "Linux" ]; then race="-race"; fi
          go test -tags nowebui -count=1 $race ./...
      - name: Cross-user path tests (Linux, needs root)
        if: runner.os == 'Linux'
        shell: bash
        run: |
          # The test runs as root only to start processes as two other users.
          go test -c -tags nowebui -o "$RUNNER_TEMP/store.test" ./internal/store/sqlite
          cd internal/store/sqlite
          sudo "$RUNNER_TEMP/store.test" -test.run 'CrossUser' -test.count=1 -test.v

  go-lint:
    name: Go lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-go@v7.0.0
        with:
          go-version-file: go.mod
      - name: go mod tidy
        run: go mod tidy -diff
      - name: go vet
        run: go vet -tags nowebui ./...
      - name: Markdown links are repository-relative
        run: |
          if grep -rnE '\]\(([A-Za-z]:[/\]|/(Users|home)/)' --include='*.md' --exclude-dir=node_modules .; then
            echo 'Markdown links must not point to local absolute paths'
            exit 1
          fi
      - uses: golangci/golangci-lint-action@v9.3.0
        with:
          version: v2.14.0

  web:
    name: Web
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - name: Format, lint, typecheck, test, build
        run: npm run check
      - uses: actions/upload-artifact@v7.0.2
        with:
          name: web-dist
          path: web/dist
          if-no-files-found: error
          retention-days: 7

  build:
    name: Build with dashboard (${{ matrix.os }})
    needs: web
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-go@v7.0.0
        with:
          go-version-file: go.mod
      - uses: actions/download-artifact@v8.0.2
        with:
          name: web-dist
          path: web/dist
      - name: Build
        shell: bash
        run: go build -o dist/specmetry$(go env GOEXE) ./cmd/specmetry
      - name: Test embedded dashboard
        run: go test -count=1 ./web/
      - name: Smoke test
        shell: bash
        env:
          SPECMETRY_HOME: ${{ runner.temp }}/specmetry-home
        run: |
          bin=dist/specmetry$(go env GOEXE)
          "$bin" version | tee version.txt
          grep -q "dashboard:       embedded" version.txt
          "$bin" doctor
          test ! -e "$SPECMETRY_HOME"
