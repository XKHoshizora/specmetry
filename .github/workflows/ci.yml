name: CI

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  go-test:
    name: Go tests (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-go@v7.0.0
        with:
          go-version-file: go.mod
      - name: Test
        shell: bash
        run: |
          race=""
          if [ "$RUNNER_OS" = "Linux" ]; then race="-race"; fi
          # -v lists every test, so the log shows which ones each platform skipped.
          if [ "$RUNNER_OS" != "Windows" ]; then
            go test -tags nowebui -count=1 -v $race ./...
            exit 0
          fi
          # Windows (maintenance item M-16, a risk mitigation the owner approved
          # on 2026-10-21; the cause is not established): internal/cli runs on
          # its own with a 20-minute package timeout, every other package with
          # go test's default 10 minutes. The packages are those of ./..., each
          # in exactly one of the two runs; both runs go to the end, and either
          # failing fails the step.
          cli=github.com/XKHoshizora/specmetry/internal/cli
          all=$(go list -tags nowebui ./...)
          rest=$(printf '%s\n' "$all" | grep -vxF "$cli" || true)
          n_all=$(($(printf '%s\n' "$all" | grep -c .)))
          n_rest=$(($(printf '%s\n' "$rest" | grep -c . || true)))
          n_cli=$(($(printf '%s\n' "$all" | grep -cxF "$cli" || true)))
          dups=$(printf '%s\n' "$all" | sort | uniq -d)
          echo "packages: $n_all in ./..., $n_rest without $cli, $n_cli of it"
          if [ -n "$dups" ] || [ "$n_cli" -ne 1 ] || [ $((n_rest + 1)) -ne "$n_all" ]; then
            echo "the package set does not split into the two runs"
            exit 1
          fi
          rc=0
          # shellcheck disable=SC2086 # one argument per package
          go test -tags nowebui -count=1 -v $rest || rc=1
          go test -tags nowebui -count=1 -v -timeout 20m "$cli" || rc=1
          exit $rc
      - name: Cross-user path tests (Linux, needs root)
        if: runner.os == 'Linux'
        shell: bash
        run: |
          # The test runs as root only to start processes as two other users.
          go test -c -tags nowebui -o "$RUNNER_TEMP/store.test" ./internal/store/sqlite
          cd internal/store/sqlite
          sudo "$RUNNER_TEMP/store.test" -test.run 'CrossUser' -test.count=1 -test.v

  go-lint:
    name: Go lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-go@v7.0.0
        with:
          go-version-file: go.mod
      - name: go mod tidy
        run: go mod tidy -diff
      - name: go vet
        run: go vet -tags nowebui ./...
      - name: Markdown links are repository-relative
        run: |
          if grep -rnE '\]\(([A-Za-z]:[/\]|/(Users|home)/)' --include='*.md' --exclude-dir=node_modules .; then
            echo 'Markdown links must not point to local absolute paths'
            exit 1
          fi
      - uses: golangci/golangci-lint-action@v9.3.0
        with:
          version: v2.14.0

  web:
    name: Web
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - name: Format, lint, typecheck, test, build
        run: npm run check
      - uses: actions/upload-artifact@v7.0.2
        with:
          name: web-dist
          path: web/dist
          if-no-files-found: error
          retention-days: 7

  build:
    name: Build with dashboard (${{ matrix.os }})
    needs: web
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-go@v7.0.0
        with:
          go-version-file: go.mod
      - uses: actions/download-artifact@v8.0.2
        with:
          name: web-dist
          path: web/dist
      - name: Build
        shell: bash
        run: go build -o dist/specmetry$(go env GOEXE) ./cmd/specmetry
      - name: Test embedded dashboard
        run: go test -count=1 ./web/
      - name: Smoke test
        shell: bash
        env:
          SPECMETRY_HOME: ${{ runner.temp }}/specmetry-home
        run: |
          bin=dist/specmetry$(go env GOEXE)
          "$bin" version | tee version.txt
          grep -q "dashboard:       embedded" version.txt
          "$bin" doctor
          test ! -e "$SPECMETRY_HOME"
